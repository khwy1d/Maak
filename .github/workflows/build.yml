name: Build check

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Deno
        uses: denoland/setup-deno@v2
      - name: Install dependencies
        run: npm install
      - name: Build site
        run: npm run build
      - name: Type-check passport upload Edge Function
        run: deno check supabase/functions/upload-passport/index.ts
