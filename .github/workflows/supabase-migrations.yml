name: Supabase migration tests

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-migrations.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-chain:
    name: Rebuild local Supabase and test M03-M12
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.1.0

      - name: Set up Deno
        uses: denoland/setup-deno@v2

      - name: Type-check passport upload Edge Function
        run: deno check supabase/functions/upload-passport/index.ts

      - name: Start isolated local Supabase stack
        run: supabase start

      - name: Apply every migration from an empty database
        run: supabase db reset

      - name: Verify idempotency, wallet debit replay, RPC shape and grants
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/migrations_smoke.sql
